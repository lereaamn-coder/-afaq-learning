موقوفة"], ["انعكست نبضة قاع عن طرف حبل مثبت؛ ما شكل النبضة المرتدة؟", ["قاع", "قمة", "لا توجد نبضة", "موجة ضوئية"], 1, "انعكاس الموجات"], ["أين تكون سعة الاهتزاز أكبر ما يمكن في الموجة الموقوفة؟", ["عند العقد", "عند البطون", "عند جميع النقاط بالتساوي", "خارج الوتر فقط"], 1, "الرنين والموجات الموقوفة"]]};const $=x=>document.getElementById(x);let sid='',mode='pre';const quizKey=()=> 'afaq_quiz_waves_v1_'+sid;const portKey=()=> 'afaq_portfolio_v1_'+sid;function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}$('start').onclick=()=>{sid=$('student').value.trim();if(!/^[A-Za-z0-9_-]{2,20}$/.test(sid)){$('notice').textContent='أدخلي رمزًا من 2 إلى 20 حرفًا أو رقمًا إنجليزيًا.';return}mode=$('mode').value;const saved=read(quizKey())||{};if(Number.isFinite(saved[mode])&&!confirm('توجد نتيجة سابقة. هل تريدين استبدالها بإعادة الاختبار؟'))return;$('questions').replaceChildren();bank[mode].forEach((q,i)=>{const fs=document.createElement('fieldset'),lg=document.createElement('legend');lg.textContent=(i+1)+'. '+q[0];fs.appendChild(lg);q[1].forEach((choice,j)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;label.append(input,document.createTextNode(' '+choice));fs.appendChild(label)});$('questions').appendChild(fs)});$('heading').textContent=(mode==='pre'?'الاختبار القبلي':'الاختبار البعدي')+' — 15 سؤالًا';$('quiz').hidden=false;$('result').hidden=true;$('notice').textContent='أجيبي عن جميع الأسئلة قبل التسليم.'};$('quiz').onsubmit=e=>{e.preventDefault();let score=0;const bySkill={};for(let i=0;i<15;i++){const chosen=document.querySelector('input[name="q'+i+'"]:checked');if(!chosen){$('notice').textContent='أكملي السؤال رقم '+(i+1);return}const q=bank[mode][i],ok=Number(chosen.value)===q[2];if(ok)score++;if(!bySkill[q[3]])bySkill[q[3]]={correct:0,total:0};bySkill[q[3]].total++;if(ok)bySkill[q[3]].correct++}const pct=Number((score
