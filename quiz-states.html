<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أفق | اختبارات حالات المادة</title><style>body{font-family:Tahoma,Arial;background:#f8f1e8;color:#35242d;margin:0}header{background:#641c35;color:white;text-align:center;padding:20px}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}button,a.btn{border:0;background:#641c35;color:white;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-block;margin:5px}input,select{padding:10px;border:1px solid #aaa;border-radius:7px;font:inherit}fieldset{border:1px solid #ddd;border-radius:10px;margin:12px 0;padding:14px}legend{font-weight:bold}label.option{display:block;margin:10px 0;cursor:pointer}.muted{color:#665d61}#result{font-weight:bold;font-size:1.1rem}</style></head><body><header><h1>🔬 أفق | اختبارات حالات المادة</h1><p>فيزياء ثالث ثانوي — إعداد أ/ وفاء حامظي</p></header><main><div class="card"><a class="btn" href="portfolio.html">العودة لملف الإنجاز</a><p class="muted">تجربة محلية: النتائج محفوظة في المتصفح الحالي فقط. استخدمي رمزًا غير كاشف للهوية، ولا تدخلي أسماء حقيقية.</p><label>رمز الطالبة <input id="student" maxlength="20" placeholder="مثال: A01"></label> <label>نوع الاختبار <select id="mode"><option value="pre">قبلي</option><option value="post">بعدي</option></select></label><button id="start">بدء الاختبار</button><p id="notice" role="status"></p></div><form class="card" id="quiz" hidden><h2 id="heading"></h2><div id="questions"></div><button type="submit">تسليم الإجابات وحفظ النتيجة</button></form><div class="card" id="result" hidden role="status"></div></main><script>const bank={"pre": [["أي المواد الآتية تُعد من الموائع؟", ["السوائل والغازات", "المواد الصلبة فقط", "الغازات فقط", "السوائل فقط"], 0, "مفهوم"], ["أي علاقة تُستخدم لحساب الضغط؟", ["القوة × المساحة", "القوة ÷ المساحة", "المساحة ÷ القوة", "الكتلة ÷ الحجم"], 1, "مفهوم"], ["ما وحدة قياس الضغط في النظام الدولي؟", ["نيوتن", "جول", "باسكال", "واط"], 2, "مفهوم"], ["أي عبارة تصف قانون بويل عند ثبات درجة الحرارة؟", ["الحجم يتناسب طرديًا مع الضغط", "الحجم يتناسب عكسيًا مع الضغط", "الضغط لا يتغير", "الحجم يتناسب طرديًا مع الكتلة"], 1, "مفهوم"], ["ما السبب المباشر للتوتر السطحي؟", ["قوى التماسك", "قوة الطفو", "الضغط الجوي", "قوة الاحتكاك"], 0, "مفهوم"], ["أثرت قوة 100 N على مساحة 4 m². كم الضغط؟", ["400 Pa", "25 Pa", "104 Pa", "0.04 Pa"], 1, "حساب"], ["غاز حجمه 4 L عند ضغط 100 kPa. إذا أصبح الضغط 200 kPa عند ثبات الحرارة، فما حجمه؟", ["8 L", "4 L", "2 L", "1 L"], 2, "حساب"], ["جسم وزنه في الهواء 60 N ووزنه الظاهري في الماء 50 N. ما قوة الطفو؟", ["110 N", "60 N", "50 N", "10 N"], 3, "حساب"], ["مكبس صغير مساحته 2 cm² تؤثر فيه قوة 20 N. ما القوة على مكبس مساحته 6 cm²؟", ["20 N", "40 N", "60 N", "120 N"], 2, "حساب"], ["ما الضغط الناتج عن عمود ماء كثافته 1000 kg/m³ وعمقه 2 m، إذا g=10 m/s²؟", ["200 Pa", "2000 Pa", "20000 Pa", "200000 Pa"], 2, "حساب"], ["لماذا يقل الضغط على الرمل عندما تزداد مساحة تماس الإطار معه؟", ["لأن القوة تقل بالضرورة", "لأن الضغط عكسي مع المساحة", "لأن الكتلة تختفي", "لأن الكثافة تزداد"], 1, "تحليل"], ["ما الذي يحدث للضغط الجوي عادة عند الصعود إلى ارتفاع أعلى؟", ["يزداد", "يبقى ثابتًا", "يقل", "يصبح صفرًا دائمًا"], 2, "تحليل"], ["لماذا يرتفع الوقود في فتيلة المصباح؟", ["الخاصية الشعرية", "الطفو", "قانون بويل", "التمدد الحجمي"], 0, "تحليل"], ["في أنبوب أفقي يتضيق، ما المتوقع للضغط الساكن إذا زادت سرعة سريان مائع مثالي؟", ["يزداد", "يقل", "يبقى دائمًا ثابتًا", "يساوي الصفر"], 1, "تحليل"], ["عند تسخين الماء من 1°C إلى 4°C، ماذا يحدث لكثافته تقريبًا؟", ["تقل", "تزداد", "لا تتغير", "تصبح صفرًا"], 1, "تحليل"]], "post": [["ما الوصف الأدق للمائع؟", ["مادة تقاوم الانسياب", "مادة يمكنها التدفق وتأخذ شكل الوعاء", "مادة لها شكل ثابت", "مادة صلبة فقط"], 1, "مفهوم"], ["أي عاملين يحددان الضغط الذي تؤثر به قوة عمودية على سطح؟", ["الكتلة والسرعة", "القوة والمساحة", "الحجم والحرارة", "الزمن والمسافة"], 1, "مفهوم"], ["ما العلاقة بين 1 Pa ووحدات القوة والمساحة؟", ["1 N/m²", "1 N·m", "1 kg/m³", "1 J/s"], 0, "مفهوم"], ["عند ثبات الضغط، يرتبط حجم كمية ثابتة من الغاز طرديًا بأي كمية؟", ["درجة الحرارة بالكلفن", "الضغط", "الكتلة", "الكثافة"], 0, "مفهوم"], ["ما القوى المسؤولة عن صعود الماء في أنبوب شعري رفيع؟", ["قوى التلاصق والتماسك", "قوى الطفو فقط", "الجاذبية فقط", "الاحتكاك فقط"], 0, "مفهوم"], ["قوة 240 N تؤثر عموديًا على سطح مساحته 6 m². كم الضغط؟", ["1440 Pa", "40 Pa", "234 Pa", "0.025 Pa"], 1, "حساب"], ["غاز حجمه 9 L عند ضغط 80 kPa. إذا زاد الضغط إلى 120 kPa عند ثبات الحرارة، فما حجمه؟", ["6 L", "12 L", "13.5 L", "18 L"], 0, "حساب"], ["جسم وزنه 45 N في الهواء و33 N عند غمره في سائل. ما مقدار قوة الطفو؟", ["78 N", "45 N", "33 N", "12 N"], 3, "حساب"], ["مكبس مساحته 5 cm² تؤثر فيه قوة 50 N. كم القوة على مكبس آخر مساحته 15 cm²؟", ["50 N", "100 N", "150 N", "250 N"], 2, "حساب"], ["كم ضغط الماء عند عمق 3 m إذا كانت كثافته 1000 kg/m³ وg=10 m/s²؟", ["300 Pa", "3000 Pa", "30000 Pa", "300000 Pa"], 2, "حساب"], ["لماذا تكون الأحذية العريضة أنسب للمشي على الثلج؟", ["تزيد الوزن", "تقلل الضغط بتوزيع القوة", "تزيد الجاذبية", "تقلل مساحة التلامس"], 1, "تحليل"], ["إذا زادت سرعة سريان سائل مثالي في جزء ضيق من أنبوب أفقي، فما المتوقع للضغط؟", ["يرتفع", "ينخفض", "لا يتأثر أبدًا", "يتحول إلى حرارة"], 1, "تحليل"], ["أي مثال يوضح تطبيق مبدأ باسكال؟", ["المكبس الهيدروليكي", "المنظار", "البندول", "العدسة المحدبة"], 0, "تحليل"], ["لماذا تتباعد قضبان السكك الحديدية بفواصل صغيرة؟", ["للسماح بالتمدد الحراري", "لزيادة كثافتها", "لخفض كتلتها", "لمنع التوصيل الكهربائي"], 0, "تحليل"], ["ما الذي يحدث لحجم بالون مرن مغلق إذا ضُغط مع ثبات كمية الغاز وحرارته؟", ["يزداد", "يقل", "يبقى دائمًا ثابتًا", "يصبح صفرًا"], 1, "تحليل"]]};const $=x=>document.getElementById(x);let sid='',mode='pre';$('start').onclick=()=>{sid=$('student').value.trim();if(!/^[A-Za-z0-9_-]{2,20}$/.test(sid)){$('notice').textContent='استخدمي رمزًا من 2 إلى 20 حرفًا أو رقمًا إنجليزيًا.';return}mode=$('mode').value;const saved=JSON.parse(localStorage.getItem('afaq_quiz_states_v1_'+sid)||'{}');if(Number.isFinite(saved[mode])&&!confirm('توجد نتيجة سابقة لهذا الاختبار. هل تريدين إعادة الاختبار واستبدالها؟'))return;$('questions').replaceChildren();bank[mode].forEach((q,i)=>{const fs=document.createElement('fieldset'),lg=document.createElement('legend');lg.textContent=(i+1)+'. '+q[0];fs.appendChild(lg);q[1].forEach((choice,j)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;label.append(input,document.createTextNode(' '+choice));fs.appendChild(label)});$('questions').appendChild(fs)});$('heading').textContent=(mode==='pre'?'الاختبار القبلي':'الاختبار البعدي')+' — 15 سؤالًا';$('quiz').hidden=false;$('result').hidden=true;$('notice').textContent='أجيبي عن جميع الأسئلة ثم اضغطي تسليم.'};$('quiz').onsubmit=e=>{e.preventDefault();let score=0;for(let i=0;i<15;i++){const chosen=document.querySelector('input[name="q'+i+'"]:checked');if(!chosen){$('notice').textContent='أكملي السؤال رقم '+(i+1);return}if(Number(chosen.value)===bank[mode][i][2])score++}const key='afaq_quiz_states_v1_'+sid;let obj={};try{obj=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};obj[mode]=Number((score/15*100).toFixed(2));obj[mode+'Date']=new Date().toISOString();try{localStorage.setItem(key,JSON.stringify(obj));const pkey='afaq_portfolio_v1_'+sid;let portfolio=JSON.parse(localStorage.getItem(pkey)||'null');if(portfolio&&portfolio.studentId===sid&&portfolio.chapters){portfolio.chapters['حالات المادة']={...(portfolio.chapters['حالات المادة']||{}),[mode]:obj[mode]};localStorage.setItem(pkey,JSON.stringify(portfolio))}$('result').textContent='نتيجتك: '+score+' من 15 ('+obj[mode].toFixed(1)+'%). تم الحفظ محليًا. افتحي ملف الإنجاز بالرمز نفسه لعرض النتيجة.'}catch(err){$('result').textContent='النتيجة: '+score+' من 15. تعذر الحفظ على هذا الجهاز؛ تحققي من إعدادات المتصفح.'}$('quiz').hidden=true;$('result').hidden=false;window.scrollTo(0,0)};</script></body></html>
